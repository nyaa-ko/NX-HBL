name: Build NX-HBL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NX-HBL
        run: make nx

      - name: Find build output
        if: always()
        run: |
          echo "Searching for build output..."
          find . -type f \( \
            -name "*.nro" -o \
            -name "*.nacp" -o \
            -name "*.nso" \
          \) -print

      - name: Upload NX-HBL
        uses: actions/upload-artifact@v4
        with:
          name: NX-HBL
          path: |
            **/*.nro
            **/*.nacp
            **/*.nso
          if-no-files-found: warn
