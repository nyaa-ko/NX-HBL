name: Build NX-HBL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Nintendo Switch Homebrew
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro
        uses: devkitPro/action@v0.1.1

      - name: Install Switch development tools
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm switch-dev switch-tools

      - name: Build NX-HBL
        run: make

      - name: Find build output
        if: always()
        run: |
          find . -type f \( \
            -name "*.nro" -o \
            -name "*.nacp" -o \
            -name "*.nso" \
          \) -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NX-HBL
          path: |
            **/*.nro
            **/*.nacp
            **/*.nso
          if-no-files-found: warn
